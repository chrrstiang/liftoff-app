name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npm run type-check

  backend-ci:
    runs-on: ubuntu-latest

    # ⚠️ A Postgres here, not only in backend-e2e, and the reason is the gate
    # rather than the database. `backend-e2e` skips itself when the Supabase
    # secrets are absent or the project is paused, so a green check there is not
    # evidence anything ran. Meanwhile the unit tier mocks Drizzle with a client
    # that ignores `where`, fakes transactions, and passes raw `sql` through
    # inert — so anything whose correctness *is* the SQL has nowhere to live.
    #
    # `*.int-spec.ts` is that place: real Postgres, no Supabase, and therefore
    # this job — the one that always runs.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: liftoff
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liftoff"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/liftoff

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Run backend unit tests
        working-directory: ./backend
        run: npm run test

      # Same chain the e2e job uses, and the same reason: `verify-port.sql` is a
      # set of assertions about the schema, not a formality.
      - name: Apply migrations to the integration database
        working-directory: ./backend
        run: |
          npx drizzle-kit migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/seed-reference-data.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/verify-port.sql

      - name: Run backend integration tests
        working-directory: ./backend
        run: npm run test:int

  backend-e2e:
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    # Serialize e2e across every run in the repo. The suite writes to ONE shared
    # live Supabase project, and `globalTeardown` sweeps every `e2e-` prefixed user
    # with `minAgeMinutes: 0` -- matching on the prefix project-wide, NOT scoped to
    # its own run id. The helper says why that was safe: `test:e2e` is
    # `--runInBand`, "so there is no concurrent suite whose fixtures could be
    # destroyed mid-run". Concurrent *jobs* break that assumption -- the first run
    # to finish deletes the other's in-flight fixtures, and the victim fails with
    # auth errors that do not reproduce.
    #
    # Without this, opening several PRs at once is enough to trigger it, which is
    # exactly what a parallel branch workflow does.
    #
    # `cancel-in-progress: false` is deliberate: a cancelled run never reaches
    # teardown, so its users leak into the project real users are in.
    concurrency:
      group: backend-e2e
      cancel-in-progress: false

    # Data lives in Postgres now, so e2e needs a real one. This is what finally
    # makes the suite hermetic for data: only the AUTH half still touches the
    # shared Supabase project, because that is where auth genuinely lives.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: liftoff
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liftoff"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres@localhost:5432/liftoff

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # E2E hits a real Supabase project — there is no local database to stand up.
      # Without credentials every spec fails identically at SupabaseService construction,
      # which turns this job into permanent red noise rather than a signal. Skip loudly
      # instead. The `secrets` context is not available in a job-level `if`, so the
      # check has to happen in a step.
      - name: Check for Supabase credentials
        id: creds
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "$SUPABASE_PROJECT_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E skipped::Set the SUPABASE_PROJECT_URL and SUPABASE_SECRET_KEY repository secrets to run the e2e suite."
          fi

      # Present is not the same as reachable. A free-tier Supabase project pauses
      # itself after a week of inactivity, and a paused project stops resolving in
      # DNS entirely — the secrets were still set, so the check above happily said
      # "configured", and the job then died 51s later inside the sweeper with an
      # opaque `TypeError: fetch failed` (getaddrinfo ENOTFOUND underneath). That
      # reads like a code bug, which is exactly the wrong place to send someone.
      #
      # /auth/v1/health answers 401 without an apikey header, so a 2xx is the wrong
      # test — ANY HTTP status proves we got to GoTrue. Only a connection/DNS
      # failure counts as unreachable, which curl reports as http_code 000.
      #
      # Same policy as the missing-secret path: warn loudly, skip, do NOT fail. A
      # red required check because the auth provider is asleep is the trap the
      # presence guard was added to avoid in the first place.
      - name: Check that Supabase is reachable
        id: reachable
        if: steps.creds.outputs.configured == 'true'
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            "${SUPABASE_PROJECT_URL%/}/auth/v1/health" || true)
          if [ -n "$status" ] && [ "$status" != "000" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
            echo "Supabase auth endpoint answered with HTTP $status — reachable."
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E skipped::Supabase did not answer at /auth/v1/health (no HTTP response within 15s). The secrets are set, so this is almost certainly a PAUSED or deleted Supabase project — free-tier projects pause after ~7 days idle and stop resolving in DNS. Resume it in the Supabase dashboard and re-run this job. Skipping the e2e suite and the sweeper rather than failing."
          fi

      - name: Install backend dependencies
        if: steps.creds.outputs.configured == 'true'
        working-directory: ./backend
        run: npm ci

      # Tables, then the five views, then reference data. Profile creation
      # validates every athlete against federations/divisions/weight_classes, so
      # without the seed each of those specs fails on a lookup rather than on the
      # behaviour it is testing.
      - name: Migrate and seed the test database
        if: steps.creds.outputs.configured == 'true'
        working-directory: ./backend
        run: |
          npx drizzle-kit migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/seed-reference-data.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/verify-port.sql

      # E2E_ALLOW_LIVE is the deliberate acknowledgement that this writes to the
      # live project. CI sets it; locally you have to type it, which is the point.
      # globalTeardown sweeps prefixed artifacts, so a crashed run still cleans up.
      - name: Run backend e2e tests
        if: steps.creds.outputs.configured == 'true' && steps.reachable.outputs.up == 'true'
        working-directory: ./backend
        run: npm run test:e2e
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NODE_ENV: test
          E2E_ALLOW_LIVE: "1"

      # Backstop: if the suite was killed (timeout, cancellation) globalTeardown
      # never ran, so leaked users would persist in the project real users are in.
      # `if: always()` is what makes this useful.
      #
      # It also has to honour the reachability gate. `sweep.ts` ends in
      # `main().catch(... process.exit(1))`, so against an unreachable project it
      # exits 1 on the first fetch and — because of `always()` — fails the job even
      # when every other step was skipped. That is the exact step the paused-project
      # incident died in. Nothing can have leaked if the suite never ran, so there
      # is nothing to sweep.
      - name: Sweep leaked e2e artifacts
        if: always() && steps.creds.outputs.configured == 'true' && steps.reachable.outputs.up == 'true'
        working-directory: ./backend
        run: npm run e2e:sweep -- --all
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          E2E_ALLOW_LIVE: "1"
