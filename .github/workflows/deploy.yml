name: Deploy API

# Deploys backend/ to ECS Fargate via Express Mode.
#
# ⚠️ NOT ACTIVE until the AWS resources exist and AWS_DEPLOY_ROLE_ARN is set as a
# repository variable. Until then every step is skipped with a loud warning rather
# than failing — the same pattern the e2e job uses for missing Supabase secrets,
# because a permanently red required check is worse than no signal at all.
#
# Setup runbook: infra/README.md

on:
  push:
    branches: [main]
    # Only redeploy when something that ends up in the image changed. A docs-only
    # commit rolling the service is pointless churn and burns deploy minutes.
    paths:
      - "backend/**"
      - "infra/ecs/task-definition.json"
      - ".github/workflows/deploy.yml"
  # Manual trigger, for rolling back to a previous image tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to this commit's SHA)"
        required: false
        type: string

# One deploy at a time. Two concurrent runs would race to register task definition
# revisions and the service could settle on the older image.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: liftoff-api
  # The Express Mode APIs take a service ARN, not cluster + name.
  ECS_SERVICE_ARN: arn:aws:ecs:us-east-2:582908772109:service/default/liftoff-api
  ECS_TASK_DEFINITION: infra/ecs/task-definition.json
  CONTAINER_NAME: Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Required for OIDC. `id-token: write` is what lets the runner request a signed
    # token to exchange for AWS credentials; without it the assume-role step fails
    # with a confusing "Credentials could not be loaded".
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `vars` is not available in a job-level `if`, so gate in a step.
      - name: Check for deploy role
        id: config
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$DEPLOY_ROLE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::Set the AWS_DEPLOY_ROLE_ARN repository variable to enable deploys. See infra/README.md."
          fi

      - name: Configure AWS credentials
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.config.outputs.configured == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit SHA, not just `latest`. An immutable tag per commit is
      # what makes rollback possible: `latest` tells you nothing about what is
      # actually running, and re-pushing it gives you no way back.
      - name: Build and push image
        if: steps.config.outputs.configured == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          # GIT_SHA is baked in so GET /health can report which commit is serving.
          # That is the only honest rollout signal -- see the deploy step below.
          docker build --build-arg "GIT_SHA=$TAG" -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Express Mode manages the service, load balancer and scaling, but a custom
      # task definition is still how SUPABASE_SECRET_KEY and DATABASE_URL get
      # injected from SSM -- the --primary-container shorthand cannot express
      # secrets. So: register a new revision pointing at the new image, then tell
      # the Express service to use it.
      - name: Register task definition revision
        if: steps.config.outputs.configured == 'true'
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ['ECS_TASK_DEFINITION'] if 'ECS_TASK_DEFINITION' in os.environ else 'infra/ecs/task-definition.json'))
          for c in d['containerDefinitions']:
              if c['name'] == os.environ['CONTAINER_NAME']:
                  c['image'] = os.environ['IMAGE']
          json.dump(d, open('/tmp/taskdef.json', 'w'))
          PY
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "registered $ARN"

      # ⚠️ **Three attempts at verifying this have now decayed. Read before editing.**
      #
      # There is no wait-for-service-stability for Express Mode, and every piece of
      # ECS metadata that looks like a rollout signal is not one:
      #
      #  1. `service.status.statusCode` is ACTIVE *before, during and after* a
      #     rollout. Polling it reported success while the old container served.
      #  2. `activeConfigurations[0].taskDefinitionArn` is the revision the service
      #     was *told* to run, not the one answering requests. It matched on the
      #     FIRST poll, one second after the update call, and again reported success
      #     over a container that never rolled.
      #  3. A hardcoded canary route (401 = new, 404 = stale) works exactly once.
      #     The route it names becomes old code on the next deploy and then passes
      #     unconditionally forever, which is how #2 went unnoticed.
      #
      # So the check does not ask ECS anything. The image has its commit baked in
      # (Dockerfile `ARG GIT_SHA`), `GET /health` reports it, and this polls the
      # public URL until the SHA it returns is the one just built. That is the
      # request path users take, answered by the process actually serving it, and it
      # cannot rot: the expected value changes with every commit by construction.
      - name: Deploy to Express service
        if: steps.config.outputs.configured == 'true'
        env:
          TASKDEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --task-definition-arn "$TASKDEF_ARN"
          echo "asked the service to run $TASKDEF_ARN"

      # Deliberately a separate step, and deliberately not gated on API_BASE_URL
      # being set: without a reachable URL there is no way to verify a rollout at
      # all, and silently skipping the only real check is what got us here.
      - name: Verify the rollout actually happened
        if: steps.config.outputs.configured == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          EXPECTED: ${{ steps.image.outputs.tag }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error title=Cannot verify::API_BASE_URL is not set, so there is no way to confirm the rollout. Set it as a repository variable."
            exit 1
          fi

          echo "waiting for $API_BASE_URL/health to report version=$EXPECTED ..."
          LAST=""
          for i in $(seq 1 60); do
            BODY=$(curl -fsS --max-time 10 "$API_BASE_URL/health" 2>/dev/null || echo '')
            VERSION=$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version","")) ' 2>/dev/null || echo '')

            if [ -n "$VERSION" ] && [ "$VERSION" != "$LAST" ]; then
              echo "  [$i/60] serving version: $VERSION"
              LAST="$VERSION"
            fi

            if [ "$VERSION" = "$EXPECTED" ]; then
              echo "rolled: the running container reports $EXPECTED"
              exit 0
            fi
            sleep 15
          done

          echo "::error title=Rollout never landed::/health still reports '${LAST:-no response}', not $EXPECTED. The service was told to use the new task definition but the old container is still serving."
          exit 1
