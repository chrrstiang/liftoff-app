name: Deploy API

# Deploys backend/ to ECS Fargate via Express Mode.
#
# ⚠️ NOT ACTIVE until the AWS resources exist and AWS_DEPLOY_ROLE_ARN is set as a
# repository variable. Until then every step is skipped with a loud warning rather
# than failing — the same pattern the e2e job uses for missing Supabase secrets,
# because a permanently red required check is worse than no signal at all.
#
# Setup runbook: infra/README.md

on:
  push:
    branches: [main]
    # Only redeploy when something that ends up in the image changed. A docs-only
    # commit rolling the service is pointless churn and burns deploy minutes.
    paths:
      - "backend/**"
      - "infra/ecs/task-definition.json"
      - ".github/workflows/deploy.yml"
  # Manual trigger, for rolling back to a previous image tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to this commit's SHA)"
        required: false
        type: string

# One deploy at a time. Two concurrent runs would race to register task definition
# revisions and the service could settle on the older image.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: liftoff-api
  # The Express Mode APIs take a service ARN, not cluster + name.
  ECS_SERVICE_ARN: arn:aws:ecs:us-east-2:582908772109:service/default/liftoff-api
  ECS_TASK_DEFINITION: infra/ecs/task-definition.json
  CONTAINER_NAME: Main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Required for OIDC. `id-token: write` is what lets the runner request a signed
    # token to exchange for AWS credentials; without it the assume-role step fails
    # with a confusing "Credentials could not be loaded".
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # `vars` is not available in a job-level `if`, so gate in a step.
      - name: Check for deploy role
        id: config
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$DEPLOY_ROLE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::Set the AWS_DEPLOY_ROLE_ARN repository variable to enable deploys. See infra/README.md."
          fi

      - name: Configure AWS credentials
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.config.outputs.configured == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit SHA, not just `latest`. An immutable tag per commit is
      # what makes rollback possible: `latest` tells you nothing about what is
      # actually running, and re-pushing it gives you no way back.
      - name: Build and push image
        if: steps.config.outputs.configured == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      # Express Mode manages the service, load balancer and scaling, but a custom
      # task definition is still how SUPABASE_SECRET_KEY and DATABASE_URL get
      # injected from SSM -- the --primary-container shorthand cannot express
      # secrets. So: register a new revision pointing at the new image, then tell
      # the Express service to use it.
      - name: Register task definition revision
        if: steps.config.outputs.configured == 'true'
        id: taskdef
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.environ['ECS_TASK_DEFINITION'] if 'ECS_TASK_DEFINITION' in os.environ else 'infra/ecs/task-definition.json'))
          for c in d['containerDefinitions']:
              if c['name'] == os.environ['CONTAINER_NAME']:
                  c['image'] = os.environ['IMAGE']
          json.dump(d, open('/tmp/taskdef.json', 'w'))
          PY
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "registered $ARN"

      # ⚠️ There is no wait-for-service-stability for Express Mode, and
      # `service.status.statusCode` is ACTIVE *before, during and after* a
      # rollout -- so polling it proves nothing. An earlier version did exactly
      # that, reported success, and left the previous container serving. A deploy
      # that lies is worse than one that fails.
      #
      # The only honest signal is the task definition the service is actually
      # running. Poll until it matches the revision just registered.
      - name: Deploy to Express service
        if: steps.config.outputs.configured == 'true'
        env:
          TASKDEF_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-express-gateway-service \
            --service-arn "$ECS_SERVICE_ARN" \
            --task-definition-arn "$TASKDEF_ARN"

          echo "waiting for the service to actually run $TASKDEF_ARN ..."
          for i in $(seq 1 60); do
            ACTIVE=$(aws ecs describe-express-gateway-service \
              --service-arn "$ECS_SERVICE_ARN" \
              --query 'service.activeConfigurations[0].taskDefinitionArn' \
              --output text 2>/dev/null || echo UNKNOWN)
            echo "  [$i/60] running: $ACTIVE"
            if [ "$ACTIVE" = "$TASKDEF_ARN" ]; then
              echo "rolled to the new revision"
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Rollout did not complete::Service never reported $TASKDEF_ARN as active."
          exit 1

      # Independent confirmation that the thing users hit actually works. A stable
      # service means the tasks are running and passing the target group check; this
      # proves the request path through DNS and the ALB does too.
      - name: Smoke test /health
        if: steps.config.outputs.configured == 'true' && vars.API_BASE_URL != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "GET $API_BASE_URL/health"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$API_BASE_URL/health"; then
              echo ""
              echo "healthy"
              # /health exists in every revision, so it cannot tell old code from
              # new. An authenticated route returning 401 rather than 404 proves
              # the router in the RUNNING image knows about it -- which is what
              # actually distinguishes a rollout from a no-op.
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$API_BASE_URL/coach-requests")
              echo "GET /coach-requests -> $CODE (401 = route exists, 404 = stale image)"
              [ "$CODE" = "404" ] && {
                echo "::error title=Stale image::/coach-requests 404s, so the running container predates this deploy."
                exit 1
              }
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "::error title=Smoke test failed::$API_BASE_URL/health did not return 200 after 5 attempts."
          exit 1
