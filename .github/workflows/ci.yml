name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npm run type-check

  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Run backend unit tests
        working-directory: ./backend
        run: npm run test

  backend-e2e:
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # E2E hits a real Supabase project — there is no local database to stand up.
      # Without credentials every spec fails identically at SupabaseService construction,
      # which turns this job into permanent red noise rather than a signal. Skip loudly
      # instead. The `secrets` context is not available in a job-level `if`, so the
      # check has to happen in a step.
      - name: Check for Supabase credentials
        id: creds
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "$SUPABASE_PROJECT_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E skipped::Set the SUPABASE_PROJECT_URL and SUPABASE_SECRET_KEY repository secrets to run the e2e suite."
          fi

      - name: Install backend dependencies
        if: steps.creds.outputs.configured == 'true'
        working-directory: ./backend
        run: npm ci

      # E2E_ALLOW_LIVE is the deliberate acknowledgement that this writes to the
      # live project. CI sets it; locally you have to type it, which is the point.
      # globalTeardown sweeps prefixed artifacts, so a crashed run still cleans up.
      - name: Run backend e2e tests
        if: steps.creds.outputs.configured == 'true'
        working-directory: ./backend
        run: npm run test:e2e
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NODE_ENV: test
          E2E_ALLOW_LIVE: "1"

      # Backstop: if the suite was killed (timeout, cancellation) globalTeardown
      # never ran, so leaked users would persist in the project real users are in.
      # `if: always()` is what makes this useful.
      - name: Sweep leaked e2e artifacts
        if: always() && steps.creds.outputs.configured == 'true'
        working-directory: ./backend
        run: npm run e2e:sweep -- --all
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          E2E_ALLOW_LIVE: "1"
